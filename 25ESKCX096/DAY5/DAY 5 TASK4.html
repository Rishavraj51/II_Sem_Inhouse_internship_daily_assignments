<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Student Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Verdana, sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
    padding:25px;
}

h1{
    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;
}

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:30px;
}

input,select{
    padding:10px;
    width:220px;
    border:2px solid #0d6efd;
    border-radius:8px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 12px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.03);
}

img{
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid #198754;
}

h3{
    margin:12px 0 5px;
    color:#0d6efd;
}

p{
    color:#555;
    margin:5px 0;
}

button{
    margin-top:12px;
    padding:10px 18px;
    border:none;
    border-radius:6px;
    background:#198754;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#157347;
}

.details{
    display:none;
    margin-top:12px;
    padding:10px;
    background:#f1f5f9;
    border-radius:8px;
    text-align:left;
}

</style>

</head>

<body>

<h1>College Student Portal</h1>

<div class="controls">

<input type="text" id="search" placeholder="Search Student">

<select id="department">
<option value="All">All Departments</option>
<option>CSE</option>
<option>IT</option>
<option>Civil</option>
<option>Electrical</option>
</select>

</div>

<div class="cards" id="cards"></div>

<script>

const students=[

{
name:"Rahul",
dept:"CSE",
year:"1st Year",
email:"rahul@gmail.com"
},

{
name:"Priya",
dept:"IT",
year:"2nd Year",
email:"priya@gmail.com"
},

{
name:"Aman",
dept:"Civil",
year:"3rd Year",
email:"aman@gmail.com"
},

{
name:"Neha",
dept:"Electrical",
year:"4th Year",
email:"neha@gmail.com"
},

{
name:"Kunal",
dept:"CSE",
year:"2nd Year",
email:"kunal@gmail.com"
},

{
name:"Ritika",
dept:"IT",
year:"1st Year",
email:"ritika@gmail.com"
}

];

const cards=document.getElementById("cards");

function display(list){

cards.innerHTML="";

list.forEach(student=>{

cards.innerHTML+=`

<div class="card">

<img src="https://i.pravatar.cc/150?u=${student.email}" alt="Student">

<h3>${student.name}</h3>

<p>${student.dept}</p>

<button onclick="toggle(this)">View Profile</button>

<div class="details">

<p><strong>Year:</strong> ${student.year}</p>

<p><strong>Email:</strong> ${student.email}</p>

</div>

</div>

`;

});

}

display(students);

function toggle(button){

let details=button.nextElementSibling;

if(details.style.display==="block"){

details.style.display="none";
button.innerHTML="View Profile";

}
else{

details.style.display="block";
button.innerHTML="Hide Profile";

}

}

document.getElementById("search").addEventListener("keyup",filterStudents);
document.getElementById("department").addEventListener("change",filterStudents);

function filterStudents(){

let search=document.getElementById("search").value.toLowerCase();

let department=document.getElementById("department").value;

let result=students.filter(student=>{

let matchName=student.name.toLowerCase().includes(search);

let matchDept=(department==="All" || student.dept===department);

return matchName && matchDept;

});

display(result);

}

window.onload=function(){

let allCards=document.querySelectorAll(".card");

allCards.forEach((card,index)=>{

card.style.opacity=0;

setTimeout(()=>{

card.style.opacity=1;
card.style.transition="0.5s";

},index*120);

});

};

</script>

</body>
</html>
