<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Landing Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Verdana, sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
    transition:0.4s;
}

.dark{
    background:#1e1e1e;
    color:white;
}

nav{
    background:#0d6efd;
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

.hero{
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    margin-bottom:20px;
}

.hero button{
    background:#198754;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

.container{
    width:75%;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    margin-bottom:25px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.dark .card{
    background:#333;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    padding:10px 18px;
    margin-top:10px;
    cursor:pointer;
}

.error{
    color:red;
    font-size:14px;
}

#count{
    font-size:28px;
    color:#0d6efd;
    margin:10px 0;
}

</style>

</head>
<body>

<nav>

<h2>Interactive Page</h2>

<ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
</ul>

</nav>

<div class="hero">

<h1>Welcome to My Website</h1>

<p>Explore simple JavaScript features with this demo page.</p>

<button onclick="toggleMode()">Switch Theme</button>

</div>

<div class="container">

<div class="card">

<h2>Visitor Counter</h2>

<p>Total Clicks:</p>

<h3 id="count">0</h3>

<button onclick="increase()">Increase</button>

<button onclick="resetCounter()">Reset</button>

</div>

<div class="card">

<h2>Feedback Form</h2>

<form onsubmit="return validateForm()">

<input type="text" id="name" placeholder="Enter Your Name">

<p id="nameError" class="error"></p>

<input type="email" id="email" placeholder="Enter Your Email">

<p id="emailError" class="error"></p>

<button type="submit">Send</button>

</form>

</div>

</div>

<script>

let count = 0;

function increase(){
    count++;
    document.getElementById("count").innerHTML = count;
}

function resetCounter(){
    count = 0;
    document.getElementById("count").innerHTML = count;
}

function toggleMode(){
    document.body.classList.toggle("dark");
}

function validateForm(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;

document.getElementById("nameError").innerHTML = "";
document.getElementById("emailError").innerHTML = "";

let valid = true;

if(name.trim() == ""){
    document.getElementById("nameError").innerHTML = "Please enter your name";
    valid = false;
}

if(email.indexOf("@") == -1 || email.indexOf(".") == -1){
    document.getElementById("emailError").innerHTML = "Please enter a valid email";
    valid = false;
}

if(valid){
    alert("Thank you! Your form has been submitted.");
}

return valid;

}

</script>

</body>
</html>
