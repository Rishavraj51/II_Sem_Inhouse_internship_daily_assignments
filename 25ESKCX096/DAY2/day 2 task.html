<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Submission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="admission-form">

    <h1>Student Details</h1>

    <form>

        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

        <label for="age">Age</label><br>
        <input type="number" id="age" name="age" placeholder="Enter your age" min="16" max="30" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="branch">Branch</label><br>
        <input type="text" id="branch" name="branch" placeholder="Enter your branch" required><br><br>

        <label for="tenth">10th Passing Year</label><br>
        <input type="number" id="tenth" name="tenth" placeholder="Enter 10th passing year" required><br><br>

        <label for="twelfth">12th Passing Year</label><br>
        <input type="number" id="twelfth" name="twelfth" placeholder="Enter 12th passing year" required><br><br>

        <label for="marksheet">Upload Marksheet</label><br>
        <input type="file" id="marksheet" name="marksheet" required><br><br>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
